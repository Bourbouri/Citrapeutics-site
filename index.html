        :root {

            --dark-bg: #0B0F19;
            --dark-text: #1E2229;
            --body-text: #4A515E;

            --border-color: #E2E8F0;

        html {

        }

            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;

            font-size: 16px;
            background-color: var(--white);
            -webkit-font-smoothing: antialiased;
        }
        /* Navigation */
        nav {

            top: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);

            border-bottom: 1px solid rgba(255, 255, 255, 0.08);

            display: block;
        }
        nav ul {

            display: flex;
            gap: 2.5rem;
        }
        nav ul li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
            font-size: 0.9rem;

        nav ul li a:hover {

        h2 {

            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--dark-text);
            letter-spacing: -0.5px;
        }
        h2::after {
            content: '';

            height: 3px;
            background: var(--orange);
            margin-top: 0.75rem;
            border-radius: 2px;

            line-height: 1.2;

        }
        .tagline {
            font-size: 1.25rem;
            color: var(--cyan);
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;

        .hero-text {

            line-height: 1.7;
            font-weight: 300;
        }

            font-weight: 500;
            transition: all 0.2s ease;

        .indication-tag:hover {

            color: var(--cyan-hover);
        }

        }
        .validation-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .highlight-card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }
        .highlight-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--dark-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .highlight-card p {
            font-size: 1rem;
            margin-bottom: 0;
        }

            background-color: var(--white);
            border-bottom: 1px solid var(--border-color);
        }

            gap: 2rem;
            margin-top: 2.5rem;
        }
        .pub-item {
            border-left: 3px solid var(--cyan);
            padding-left: 1.5rem;
        }
        .pub-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
        }
        .pub-meta {
            font-size: 0.95rem;
            color: var(--body-text);
            margin-bottom: 0.75rem;
        }
        .pub-link {
            display: inline-flex;
            align-items: center;
            color: var(--orange);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }
