<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Citrapeutics | Targeting ACOD1 for Cancer Immunotherapy</title>
    <meta name="description" content="Citrapeutics is developing first-in-class ACOD1 inhibitors for cancer immunotherapy. Preclinical-stage, oral small molecules.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --orange: #E67300;
            --cyan: #3AC4E0;
            --cyan-hover: #29b3cf;
            --dark-bg: #0B0F19;
            --dark-text: #1E2229;
            --body-text: #4A515E;
            --light-bg: #F8FAFC;
            --white: #FFFFFF;
            --border-color: #E2E8F0;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--dark-text);
            line-height: 1.7;
            font-size: 16px;
            background-color: var(--white);
            -webkit-font-smoothing: antialiased;
        }
        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        nav .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
            height: 40px;
        }
        nav .logo-svg {
            height: 100%;
            width: auto;
            display: block;
        }
        nav ul {
            list-style: none;
            display: flex;
            gap: 2.5rem;
        }
        nav ul li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.75);
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.2s ease;
        }
        nav ul li a:hover {
            color: var(--cyan);
        }
        /* Global Section Styles */
        section {
            padding: 8rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }
        .section-inner {
            max-width: 800px;
        }
        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--dark-text);
            letter-spacing: -0.5px;
        }
        h2::after {
            content: '';
            display: block;
            width: 40px;
            height: 3px;
            background: var(--orange);
            margin-top: 0.75rem;
            border-radius: 2px;
        }
        p {
            margin-bottom: 1.5rem;
            color: var(--body-text);
            font-size: 1.05rem;
        }
        /* Hero Section (Dark & Immersive) */
        #hero {
            max-width: 100%;
            background-color: var(--dark-bg);
            background-image: radial-gradient(circle at 80% 20%, rgba(58, 196, 224, 0.08) 0%, transparent 50%),
                              radial-gradient(circle at 20% 80%, rgba(230, 115, 0, 0.05) 0%, transparent 50%);
            padding: 13rem 2rem 9rem 2rem;
            text-align: left;
        }
        .hero-container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            font-size: 3.25rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 1.5rem;
            line-height: 1.2;
            letter-spacing: -1px;
        }
        .tagline {
            font-size: 1.25rem;
            color: var(--cyan);
            font-weight: 500;
            margin-bottom: 2rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .hero-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.7;
            font-weight: 300;
        }
        /* Science Section */
        #science {
            background-color: var(--white);
        }
        strong {
            color: var(--dark-text);
            font-weight: 600;
        }
        /* Indications layout */
        .indications {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .indication-tag {
            background: var(--light-bg);
            color: var(--dark-text);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1.25rem;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .indication-tag:hover {
            border-color: var(--cyan);
            background-color: rgba(58, 196, 224, 0.05);
            color: var(--cyan-hover);
        }
        /* Validation / News Section */
        #validation {
            background-color: var(--light-bg);
            max-width: 100%;
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }
        .validation-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }
        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }
        .highlight-card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 2px 4px -1px rgba(0, 0, 0, 0.01);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
        }
        .highlight-card h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--dark-text);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .highlight-card p {
            font-size: 1rem;
            margin-bottom: 0;
        }
        /* Contact Section */
        #contact {
            background-color: var(--white);
        }
        .contact-info {
            background: var(--light-bg);
            padding: 2.5rem;
            border-radius: 12px;
            margin-top: 2rem;
            border: 1px solid var(--border-color);
            display: inline-block;
            min-width: 320px;
        }
        .contact-line {
            display: flex;
            margin-bottom: 1rem;
            font-size: 1.05rem;
        }
        .contact-line:last-child {
            margin-bottom: 0;
        }
        .contact-label {
            font-weight: 600;
            width: 100px;
            color: var(--dark-text);
        }
        .contact-value a {
            color: var(--orange);
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }
        .contact-value a:hover {
            border-color: var(--orange);
        }
        /* Footer */
        footer {
            text-align: center;
            padding: 3rem 2rem;
            background: var(--dark-bg);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        /* Responsive Framework */
        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            section {
                padding: 5rem 1.5rem;
            }
            #hero {
                padding: 11rem 1.5rem 6rem 1.5rem;
            }
            .highlights {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            .highlight-card {
                padding: 2rem;
            }
        }
        @media (max-width: 550px) {
            nav .nav-container {
                flex-direction: column;
                gap: 1rem;
            }
            nav ul {
                gap: 1.5rem;
            }
            #hero {
                padding-top: 13rem;
            }
        }
    </style>
</head>
