<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Citrapeutics | Targeting ACOD1 for Cancer Immunotherapy</title>

    <meta
        name="description"
        content="Citrapeutics is developing first-in-class ACOD1 inhibitors for cancer immunotherapy. Preclinical-stage, oral small molecules."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --orange: #e67300;
            --cyan: #3ac4e0;
            --cyan-hover: #29b3cf;
            --dark-bg: #0b0f19;
            --dark-text: #1e2229;
            --body-text: #4a515e;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--dark-text);
            line-height: 1.7;
            font-size: 16px;
            background-color: var(--white);
            -webkit-font-smoothing: antialiased;
        }

        /* NAVIGATION */

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(11, 15, 25, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            padding: 1rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .nav-container {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-link {
            display: flex;
            align-items: center;
            text-decoration: none;
        }

        .logo-img {
            height: 42px;
            width: auto;
            display: block;
            object-fit: contain;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        nav ul li a {
            text-decoration: none;
            color: rgba(255, 255, 255, 0.78);
            font-weight: 500;
            font-size: 0.92rem;
            transition: color 0.2s ease;
        }

        nav ul li a:hover,
        nav ul li a:focus-visible {
            color: var(--cyan);
        }

        /* GLOBAL SECTION STYLES */

        section {
            padding: 7rem 2rem;
            max-width: 1100px;
            margin: 0 auto;
        }

        .section-inner {
            max-width: 800px;
        }

        h1 {
            font-size: 3.4rem;
            font-weight: 700;
            color: var(--white);
            margin-bottom: 1.5rem;
            line-height: 1.15;
            letter-spacing: -1px;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 2rem;
            color: var(--dark-text);
            letter-spacing: -0.5px;
        }

        h2::after {
            content: "";
            display: block;
            width: 42px;
            height: 3px;
            background: var(--orange);
            margin-top: 0.75rem;
            border-radius: 2px;
        }

        p {
            margin-bottom: 1.5rem;
            color: var(--body-text);
            font-size: 1.05rem;
        }

        strong {
            color: var(--dark-text);
            font-weight: 600;
        }

        /* HERO */

        #hero {
            max-width: 100%;
            background-color: var(--dark-bg);
            
            /* Background image with subtle color overlay gradients */
            background-image:
                radial-gradient(
                    circle at 80% 20%,
                    rgba(58, 196, 224, 0.12) 0%,
                    transparent 50%
                ),
                radial-gradient(
                    circle at 20% 80%,
                    rgba(230, 115, 0, 0.08) 0%,
                    transparent 50%
                ),
                url("Picture1.png");
            
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            padding: 13rem 2rem 9rem;
        }

        .hero-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .tagline {
            font-size: 1.1rem;
            color: var(--cyan);
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .hero-text {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.85);
            line-height: 1.8;
            font-weight: 300;
            max-width: 720px;
        }

        /* INDICATION TAGS */

        .indications {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            margin-top: 2rem;
        }

        .indication-tag {
            background: var(--light-bg);
            color: var(--dark-text);
            border: 1px solid var(--border-color);
            padding: 0.55rem 1.25rem;
            border-radius: 999px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .indication-tag:hover {
            border-color: var(--cyan);
            background-color: rgba(58, 196, 224, 0.05);
            color: var(--cyan-hover);
        }

        /* VALIDATION */

        #validation {
            max-width: 100%;
            background: var(--light-bg);
            border-top: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
        }

        .validation-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 2rem;
        }

        .highlights {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-top: 3rem;
        }

        .highlight-card {
            background: var(--white);
            padding: 2.2rem;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.03),
                0 2px 4px -1px rgba(0, 0, 0, 0.02);
            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow:
                0 12px 20px -6px rgba(0, 0, 0, 0.06),
                0 4px 10px -4px rgba(0, 0, 0, 0.03);
        }

        .highlight-card h3 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: var(--dark-text);
        }

        .highlight-card p {
            margin-bottom: 0;
            font-size: 1rem;
        }

        /* PUBLICATIONS */

        #publications {
            border-bottom: 1px solid var(--border-color);
        }

        .pub-list {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            margin-top: 2.5rem;
        }

        .pub-item {
            border-left: 3px solid var(--cyan);
            padding-left: 1.5rem;
        }

        .pub-title {
            font-size: 1.12rem;
            font-weight: 600;
            color: var(--dark-text);
            margin-bottom: 0.5rem;
        }

        .pub-meta {
            font-size: 0.95rem;
            color: var(--body-text);
            margin-bottom: 0.75rem;
        }

            display: inline-flex;
